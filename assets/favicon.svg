23. PIXEL ART STUDIO
Create a complete professional pixel editor.
The editor's main drawing area MUST be a real pixel grid.
Every cell represents exactly one pixel.
Example:

□ □ □ □ □ □ □ □
□ □ ■ ■ □ □ □ □
□ ■ ■ ■ ■ □ □ □
□ ■ ■ ■ ■ ■ □ □
□ □ ■ ■ □ □ □ □
The user edits individual cells.
Do NOT use blurry freehand painting.


