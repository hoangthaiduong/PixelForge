tạo logo (ko phải favcion ) cho 1 trang web như thế này: PIXELFORGE

The only limit is your imagination
Build a complete, polished, production-ready pixel creation web application called PixelForge.
PixelForge is an all-in-one creative tool for:

Pixel Art Studio
Pixel Animation Studio
Minecraft Skin Creator
This is NOT a landing page, mockup, prototype, or visual concept.
Build the actual working application from the beginning.


1. CORE OBJECTIVE
Create a professional browser-based creative application where users can:

Draw pixel art.
Create frame-by-frame pixel animations.
Create and edit Minecraft skins.
Preview Minecraft skins on a rotatable 3D character.
Save and reopen projects.
Import and export files.
Work locally without an account.
Work without an API key.
Use the core features offline.
Run the project directly by opening index.html.
Deploy the same project to GitHub Pages and Vercel.
Every core feature must actually work.
Do not create fake functionality.


2. ABSOLUTE RULES
DO NOT:
Create a landing page pretending to be an application.
Create fake editors.
Create fake canvas interactions.
Create fake animation playback.
Create fake 3D previews.
Create fake file saving.
Create fake importing.
Create fake exporting.
Create placeholder buttons.
Create unfinished core features.
Leave TODO comments for core functionality.
Require an API key.
Require a backend.
Require user accounts.
Require a database server.
Require paid services.
Require a cloud service for core functionality.
Use eval().
Use new Function().
If a feature appears in the interface, it must work.
If a technically difficult feature cannot be implemented reliably, simplify the feature rather than displaying a broken/fake version.


3. RUNNING REQUIREMENT — VERY IMPORTANT
The project MUST support direct local execution.
The user should be able to:

Download project
↓
Extract project
↓
Double-click index.html
↓
PixelForge opens
Opening:

index.html
must launch the application without requiring:

npm run dev
or a local server.
A development server may exist as an OPTIONAL development workflow, but it must NOT be required just to open the application.


4. MULTI-FILE PROJECTS ARE ALLOWED
Do NOT force the project into one HTML file.
Multiple files are completely allowed and preferred when they improve:

Code quality
Maintainability
Performance
Organization
Modularity
Reliability
You may use:

HTML
CSS
JavaScript
JSON
SVG
PNG
WebP
Fonts
Web Manifest
Service Worker
Other necessary static assets
Use as many files as genuinely necessary.
Do NOT create unnecessary files.
Every file must have a clear purpose.


5. INDEX.HTML REQUIREMENT
The project MUST contain:

index.html
as the main entry point.
It should be easy for a normal user to find.
Prefer a simple top-level structure such as:

PixelForge/
├── index.html
├── assets/
├── css/
├── js/
└── README.md
The exact architecture may differ if necessary.


6. LOCAL FILE COMPATIBILITY
PixelForge should work when opened using:

file:///
as much as browser security allows.
Do not assume an HTTP server is always available.
Use graceful fallbacks for APIs that require a secure origin.
For example:

File System Access API
Use it when available.
Fallback:

<input type="file">
FileReader
Blob
Download
PWA / Service Worker
Treat this as an enhancement.
Do not make the application fail when opened directly from file://.

Storage
Use IndexedDB when available.
Provide reasonable fallback behavior if browser storage is unavailable.


7. DEPLOYMENT REQUIREMENT
The same project MUST be deployable to:

GitHub Pages
AND

Vercel
The production application must work correctly on both.
It must not require a server runtime.


8. GITHUB PAGES COMPATIBILITY
